<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Share — Donut Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      padding: 32px 24px;
    }

    .page-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .page-sub   { font-size: 13px; color: #888; margin-bottom: 32px; }

    /* buyer switcher */
    .switcher {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px;
    }
    .switcher-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1.5px solid #e0e0e0; background: #fff; color: #888; cursor: pointer;
      transition: all .15s;
    }
    .switcher-btn.active {
      background: #1a1a2e; color: #fff; border-color: #1a1a2e;
    }

    /* widget card */
    .widget {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.09);
      max-width: 380px;
      overflow: hidden;
    }
    .widget-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid #f5f5f5;
      display: flex; align-items: center; justify-content: space-between;
    }
    .widget-title     { font-size: 13px; font-weight: 700; color: #1a1a2e; }
    .widget-buyer-tag {
      font-size: 10px; color: #aaa; margin-top: 2px;
    }
    .widget-body { padding: 16px 18px; }

    /* period row */
    .period-block { margin-bottom: 6px; }
    .period-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .9px; color: #aaa; margin-bottom: 10px;
    }
    .period-inner {
      display: flex; align-items: center; gap: 14px;
    }

    /* donut */
    .donut-wrap { flex-shrink: 0; }
    .donut-wrap svg { display: block; }

    /* right content */
    .period-right { flex: 1; }
    .period-message {
      font-size: 13px; font-weight: 700; color: #1a1a2e;
      line-height: 1.4; margin-bottom: 8px;
    }
    .period-message .pct { color: #5c35d4; }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }

    /* chips */
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 20px;
      font-size: 10px; font-weight: 600; white-space: nowrap;
    }
    .chip-rank   { background: #ede9fb; color: #5c35d4; }
    .chip-ahead  { background: #e6f4ea; color: #2e7d32; }
    .chip-behind { background: #fff3e0; color: #e65100; }
    .chip-solo   { background: #e3f2fd; color: #1565c0; }

    .period-divider { height: 1px; background: #f5f5f5; margin: 14px 0; }

  </style>
</head>
<body>

  <div class="page-title">Your Share — Donut Widget</div>
  <div class="page-sub">MTD &amp; YTD with dynamic message, rank chip, and ahead/behind chip.</div>

  <!-- Buyer switcher -->
  <div class="switcher">
    <button class="switcher-btn active" onclick="setData('kc')">K C India Ltd</button>
    <button class="switcher-btn" onclick="setData('hul')">HUL</button>
    <button class="switcher-btn" onclick="setData('tata')">Tata Motors</button>
    <button class="switcher-btn" onclick="setData('reliance')">Reliance</button>
  </div>

  <!-- Widget -->
  <div class="widget">
    <div class="widget-header">
      <div>
        <div class="widget-title">Your Share · MTD &amp; YTD</div>
        <div class="widget-buyer-tag" id="buyer-tag">K C India Ltd · My Buyers</div>
      </div>
    </div>
    <div class="widget-body">

      <!-- MTD -->
      <div class="period-block">
        <div class="period-label">MTD Share</div>
        <div class="period-inner">
          <div class="donut-wrap">
            <svg id="mtd-svg" width="68" height="68" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="14" fill="none" stroke="#ede9fb" stroke-width="4"/>
              <circle id="mtd-arc" cx="18" cy="18" r="14" fill="none" stroke="#5c35d4" stroke-width="4"
                stroke-linecap="round" transform="rotate(-90 18 18)"
                stroke-dasharray="0 87.96"/>
              <text id="mtd-pct-text" x="18" y="21" text-anchor="middle"
                font-size="7.5" font-weight="800" fill="#5c35d4">–</text>
            </svg>
          </div>
          <div class="period-right">
            <div class="period-message" id="mtd-message">–</div>
            <div class="chip-row" id="mtd-chips"></div>
          </div>
        </div>
      </div>

      <div class="period-divider"></div>

      <!-- YTD -->
      <div class="period-block">
        <div class="period-label">YTD Share</div>
        <div class="period-inner">
          <div class="donut-wrap">
            <svg id="ytd-svg" width="68" height="68" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="14" fill="none" stroke="#ede9fb" stroke-width="4"/>
              <circle id="ytd-arc" cx="18" cy="18" r="14" fill="none" stroke="#7c4dff" stroke-width="4"
                stroke-linecap="round" transform="rotate(-90 18 18)"
                stroke-dasharray="0 87.96"/>
              <text id="ytd-pct-text" x="18" y="21" text-anchor="middle"
                font-size="7.5" font-weight="800" fill="#7c4dff">–</text>
            </svg>
          </div>
          <div class="period-right">
            <div class="period-message" id="ytd-message">–</div>
            <div class="chip-row" id="ytd-chips"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // circumference = 2π × 14 = 87.96
    const C = 87.96;

    const buyers = {
      kc: {
        name: 'K C India Ltd',
        mtd: {
          pct: 63,
          message: 'Financing <span class="pct">63%</span> of buyer\'s May total',
          rank: 1,
          totalFinanciers: 4,
          gapAmt: '₹12.4L',
          gapDir: 'ahead',     // 'ahead' = you are ahead of #2 | 'behind' = #1 is ahead of you
          gapOf: '#2'
        },
        ytd: {
          pct: 58,
          message: 'Financing <span class="pct">58%</span> of buyer\'s Q1 FY26 total',
          rank: 1,
          totalFinanciers: 4,
          gapAmt: '₹8.6L',
          gapDir: 'ahead',
          gapOf: '#2'
        }
      },
      hul: {
        name: 'HUL',
        mtd: {
          pct: 21,
          message: 'Financing <span class="pct">21%</span> of buyer\'s May total',
          rank: 3,
          totalFinanciers: 6,
          gapAmt: '₹32.6L',
          gapDir: 'behind',
          gapOf: '#1'
        },
        ytd: {
          pct: 19,
          message: 'Financing <span class="pct">19%</span> of buyer\'s Q1 FY26 total',
          rank: 3,
          totalFinanciers: 6,
          gapAmt: '₹1.2Cr',
          gapDir: 'behind',
          gapOf: '#1'
        }
      },
      tata: {
        name: 'Tata Motors',
        mtd: {
          pct: 44,
          message: 'Financing <span class="pct">44%</span> of buyer\'s May total',
          rank: 2,
          totalFinanciers: 5,
          gapAmt: '₹18.2L',
          gapDir: 'behind',
          gapOf: '#1'
        },
        ytd: {
          pct: 47,
          message: 'Financing <span class="pct">47%</span> of buyer\'s Q1 FY26 total',
          rank: 2,
          totalFinanciers: 5,
          gapAmt: '₹14.8L',
          gapDir: 'behind',
          gapOf: '#1'
        }
      },
      reliance: {
        name: 'Reliance',
        mtd: {
          pct: 100,
          message: 'Financing <span class="pct">100%</span> of buyer\'s May total',
          rank: 1,
          totalFinanciers: 1,
          gapAmt: null,
          gapDir: 'solo',
          gapOf: null
        },
        ytd: {
          pct: 92,
          message: 'Financing <span class="pct">92%</span> of buyer\'s Q1 FY26 total',
          rank: 1,
          totalFinanciers: 2,
          gapAmt: '₹6.4L',
          gapDir: 'ahead',
          gapOf: '#2'
        }
      }
    };

    function buildChips(d) {
      const rankChip = `<span class="chip chip-rank">#${d.rank} of ${d.totalFinanciers} financiers</span>`;

      let gapChip = '';
      if (d.gapDir === 'ahead') {
        gapChip = `<span class="chip chip-ahead">${d.gapOf} · ${d.gapAmt} behind you</span>`;
      } else if (d.gapDir === 'behind') {
        gapChip = `<span class="chip chip-behind">${d.gapOf} · ${d.gapAmt} ahead</span>`;
      } else if (d.gapDir === 'solo') {
        gapChip = `<span class="chip chip-solo">Only financier</span>`;
      }

      return rankChip + gapChip;
    }

    function setArc(arcEl, pctTextEl, pct) {
      const filled = (pct / 100) * C;
      arcEl.setAttribute('stroke-dasharray', `${filled.toFixed(2)} ${C}`);
      pctTextEl.textContent = pct + '%';
    }

    function setData(key) {
      const d = buyers[key];

      // switcher
      document.querySelectorAll('.switcher-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      // buyer tag
      document.getElementById('buyer-tag').textContent = d.name + ' · My Buyers';

      // MTD
      setArc(
        document.getElementById('mtd-arc'),
        document.getElementById('mtd-pct-text'),
        d.mtd.pct
      );
      document.getElementById('mtd-message').innerHTML = d.mtd.message;
      document.getElementById('mtd-chips').innerHTML = buildChips(d.mtd);

      // YTD
      setArc(
        document.getElementById('ytd-arc'),
        document.getElementById('ytd-pct-text'),
        d.ytd.pct
      );
      document.getElementById('ytd-message').innerHTML = d.ytd.message;
      document.getElementById('ytd-chips').innerHTML = buildChips(d.ytd);
    }

    // init
    document.addEventListener('DOMContentLoaded', () => {
      const d = buyers.kc;
      document.getElementById('buyer-tag').textContent = d.name + ' · My Buyers';
      setArc(document.getElementById('mtd-arc'), document.getElementById('mtd-pct-text'), d.mtd.pct);
      document.getElementById('mtd-message').innerHTML = d.mtd.message;
      document.getElementById('mtd-chips').innerHTML = buildChips(d.mtd);
      setArc(document.getElementById('ytd-arc'), document.getElementById('ytd-pct-text'), d.ytd.pct);
      document.getElementById('ytd-message').innerHTML = d.ytd.message;
      document.getElementById('ytd-chips').innerHTML = buildChips(d.ytd);
    });
  </script>

</body>
</html>
